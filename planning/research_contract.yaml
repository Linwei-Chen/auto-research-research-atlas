question: "Auto-Research 的发展全貌、主要技术路线、证据边界、关键系统与尚未解决的问题是什么？"
objects: "以人工智能系统为主要执行者、能跨越两个及以上科研环节并形成可检验研究产物的自主或半自主研究系统；同时单列与该领域同名的具体项目。"
tasks: "研究问题形成与假设生成；文献与证据综合；研究计划与实验设计；代码或模型实验迭代；数据分析与解释；科学发现；同行评议与研究报告生成；端到端科研编排。"
contexts: "以数字环境中的计算机科学、机器学习和数据密集型科学为核心；将机器人实验室和专业科学发现系统作为重要应用分支；不限定地域。"
mechanism_scope: "大语言模型智能体、多智能体协作、工具调用、检索与记忆、代码执行、搜索/优化循环、模拟器和实验设备闭环、人机协作与治理机制。"
outcomes: "可复现的研究计划、证据链、代码与实验记录、候选发现、论文或评审；重点评估正确性、创新性、可复现性、成本、自主性和安全性。"
time_window: "奠基工作至 2026-08-09"
languages: ["英文", "中文"]
source_families: ["正式会议与期刊", "官方报告与标准", "作者项目与代码"]
publication_statuses: ["同行评议", "预印本", "官方报告"]
must_cover_axes: ["主要路线", "第二分类轴", "时间线", "评测", "反证与安全"]
exclusions:
  - "只自动化单一、低层操作且没有科研决策闭环的工具。"
  - "传统 AutoML、神经架构搜索或超参数优化，除非其工作直接扩展为研究问题—实验—解释闭环。"
  - "只做通用网络搜索、问答或文本润色且不生成可核验科研产物的系统。"
  - "仅营销声明、缺少方法或评测细节、无法定位一手入口的产品。"
  - "与 Auto-Research 只有名称重合的自动研究报告服务。"
cutoff_date: "2026-08-09"
target_level: "L2"
current_level: "L2"
comprehensiveness_definition: "执行发现、核验、反证、补漏四轮；覆盖七类查询家族、各主要路线的奠基/代表/前沿/评测或反证位置；以两轮低于 5% 的去重新增率和无新增一级路线作为证据饱和条件，而非宣称绝对穷尽。"
version: 1
scope_changes: []
